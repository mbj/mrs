# Allowed duplicate crate versions for clippy::multiple_crate_versions lint
#
# These duplicates are caused by transitive dependencies that cannot be
# resolved without waiting for upstream crates to update their dependencies.
#
# The lint reads the `cargo metadata` graph, which also lists optional
# dependencies that are never compiled (e.g. those referenced only through
# weak `dep?/feature` syntax), so some entries below never reach a build.

allowed-duplicate-crates = [
    # google-cloud-auth and google-cloud-wkt moved to base64 0.23, while
    # reqwest, tonic, hyper-util, msqlx, serde_with, jsonwebtoken and
    # stack-deploy's own dependency are all still on 0.22.
    "base64",

    # jiff declares an optional defmt dependency, which we never enable and so
    # never compile. It resolves bitflags 1.3 into the graph regardless, and
    # multiple_crate_versions reads the graph rather than the activated
    # features. Everything actually built uses bitflags 2.x.
    "bitflags",

    # serde_with 3.x (transitive from google-cloud-sql-v1) depends on indexmap 1.9
    # and schemars 0.9, while the rest of the workspace uses indexmap 2.x and schemars 1.x
    "indexmap",
    "schemars",

    # hashbrown 0.15 uses foldhash 0.1, while hashbrown 0.16/0.17 (indexmap 2.x,
    # lru, msqlx, hashlink) use foldhash 0.2. hashbrown 0.15 only comes from
    # wasmparser, through getrandom 0.4 -> wasip3 -> wit-bindgen 0.51 ->
    # wit-component/wit-parser. WASI-target-only dep, not built on Linux.
    "foldhash",

    # opentelemetry_sdk uses rand 0.9, while pg-ephemeral, msqlx-postgres,
    # google-cloud-gax and quinn-proto use rand 0.10.
    # rand_core follows (0.9 vs 0.10), plus rand_core 0.6 from signature via
    # jsonwebtoken, which is never compiled (see untrusted below).
    "rand",
    "rand_core",

    # getrandom 0.4 from rand 0.10, uuid, zip and quinn-proto; 0.3 from
    # rand_core 0.9 and jobserver; 0.2 from jsonwebtoken, rand_core 0.6 and
    # ring, none of which are compiled.
    "getrandom",

    # sha2 0.10 -> cpufeatures 0.2, while aes, chacha20, sha1 and sha2 0.11
    # use cpufeatures 0.3
    "cpufeatures",

    # sha2 0.11 (direct dep) vs 0.10 (transitive from msqlx-core and
    # msqlx-macros-core). Also causes duplicate digest, crypto-common, block-buffer
    "sha2",
    "digest",
    "crypto-common",
    "block-buffer",

    # untrusted 0.7.1 vs 0.9.0 (from rustls-webpki). Only 0.9.0 is compiled.
    # google-cloud-auth's default `default-idtoken-backend` feature carries the
    # weak `jsonwebtoken?/aws_lc_rs`, which puts the never-compiled jsonwebtoken
    # in the graph; its aws-lc-rs dependency keeps default features, whose
    # `ring-io`/`ring-sig-verify` pull untrusted 0.7.1.
    "untrusted",

    # getrandom 0.3 -> r-efi 5.x, getrandom 0.4 -> r-efi 6.x
    "r-efi",

    # getrandom 0.3 -> wasip2 -> wit-bindgen 0.57, getrandom 0.4 -> wasip3 ->
    # wit-bindgen 0.51. WASI-target-only dep, not built on Linux.
    "wit-bindgen",

    # Windows platform crates - multiple versions pulled by various dependencies
    # (tokio, rustls, aws-sdk, zip, etc.) targeting different Windows APIs
    # These are platform-specific and don't affect Linux builds, but clippy
    # still reports them. Common in the Rust ecosystem due to gradual migrations.
    "windows-sys",
    "windows-targets",
    "windows_aarch64_gnullvm",
    "windows_aarch64_msvc",
    "windows_i686_gnu",
    "windows_i686_gnullvm",
    "windows_i686_msvc",
    "windows_x86_64_gnu",
    "windows_x86_64_gnullvm",
    "windows_x86_64_msvc",
]
