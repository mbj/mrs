[package]
name = "pg-client"
version = "0.7.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "PostgreSQL client configuration and connection management"
license = "MIT"
repository = "https://github.com/mbj/mrs/tree/main/pg-client"
readme = "README.md"
keywords = ["postgres", "postgresql", "database", "client"]
categories = ["database"]

[lints]
workspace = true

[features]
default = []
clap = ["dep:clap", "dep:nom-language"]
serde = ["dep:serde_json"]
test-utils = []
tools = ["dep:indoc", "dep:log", "serde", "tokio/rt", "tokio/sync"]

[dependencies]
base64.workspace = true
bigdecimal.workspace = true
chrono.workspace = true
clap = { workspace = true, optional = true }
cmd-proc.workspace = true
hmac.workspace = true
indoc = { workspace = true, optional = true }
log = { workspace = true, optional = true }
nom.workspace = true
nom-language = { workspace = true, optional = true }
pbkdf2.workspace = true
rand.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2.workspace = true
smallvec.workspace = true
stringprep.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync"] }
tokio-rustls.workspace = true
uuid.workspace = true
yasna.workspace = true

[[bench]]
name = "receive"
harness = false

[dev-dependencies]
env_logger.workspace = true
indoc.workspace = true
ociman.workspace = true
# Path-only to avoid circular dependency on publish, version-less dev-deps get stripped.
pg-ephemeral = { path = "../pg-ephemeral" }
pretty_assertions.workspace = true
serde_json.workspace = true
tokio.workspace = true
