[package]
name = "pg-ephemeral"
version = "0.7.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Ephemeral PostgreSQL instances for testing"
license = "MIT"
repository = "https://github.com/mbj/mrs/tree/main/pg-ephemeral"
readme = "README.md"
keywords = ["postgres", "postgresql", "testing", "database"]
categories = ["development-tools::testing"]

[features]
test-utils = []

[lints]
workspace = true

[dependencies]
aws-lc-rs.workspace = true
clap.workspace = true
cmd-proc.workspace = true
comfy-table.workspace = true
env_logger.workspace = true
git-proc.workspace = true
hex.workspace = true
indexmap = { version = "2.13", features = ["serde"] }
log.workspace = true
nom.workspace = true
nom-language.workspace = true
ociman.workspace = true
pem-rfc7468 = { workspace = true, features = ["std"] }
pg-client.workspace = true
rand.workspace = true
rustix.workspace = true
rustls-pki-types.workspace = true
rustls-webpki.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = "0.3"
tokio = { workspace = true, features = ["net", "time"] }
toml.workspace = true
yasna.workspace = true

[dev-dependencies]
http.workspace = true
indoc.workspace = true
reqwest.workspace = true
typed-reqwest.workspace = true
url.workspace = true

[[bin]]
name = "pg-ephemeral"
